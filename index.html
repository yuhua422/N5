<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沙漏計時器與大字跑馬燈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', 'Inter', sans-serif;
        }
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(217, 119, 6, 0.4)); }
            50% { filter: drop-shadow(0 0 30px rgba(245, 158, 11, 0.8)); }
        }
        .hourglass-active {
            animation: pulse-glow 3s infinite ease-in-out;
        }
        @keyframes marquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }
        .animate-marquee {
            display: inline-flex;
            white-space: nowrap;
            animation: marquee 20s linear infinite;
        }
        .animate-marquee:hover {
            animation-play-state: paused;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-50 via-orange-50 to-stone-100 dark:from-stone-900 dark:via-stone-800 dark:to-neutral-900 text-stone-800 dark:text-stone-100 h-full flex flex-col justify-between overflow-hidden">

    <header class="w-full py-2 px-6 flex justify-between items-center max-w-6xl mx-auto flex-shrink-0">
        <div class="flex items-center space-x-2">
            <div class="w-7 h-7 rounded-xl bg-amber-500/10 dark:bg-amber-400/10 flex items-center justify-center text-amber-600 dark:text-amber-400 font-bold text-base">⏳</div>
            <h1 class="text-lg font-bold tracking-tight bg-gradient-to-r from-amber-600 to-orange-600 dark:from-amber-400 dark:to-orange-400 bg-clip-text text-transparent">沙漏計時器與大字跑馬燈</h1>
        </div>
        <div class="flex items-center space-x-2">
            <div id="statusIndicator" class="text-xs px-3 py-1 rounded-full bg-stone-200 dark:bg-stone-700 text-stone-700 dark:text-stone-200 flex items-center space-x-1.5 shadow-sm">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                <span>本機儲存就緒</span>
            </div>
            <div id="toast" class="hidden px-4 py-1 bg-stone-900 text-white dark:bg-stone-100 dark:text-stone-900 rounded-xl text-xs font-medium shadow-xl transition-all duration-300 transform translate-y-1 opacity-0 z-50"></div>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center px-4 py-1 max-w-5xl mx-auto w-full space-y-3 overflow-hidden">
        
        <!-- TOP: MARQUEE BANNER (3 Memory Slots) -->
        <div class="w-full bg-stone-900 dark:bg-stone-950 text-amber-400 rounded-2xl p-3 shadow-xl border border-stone-800 relative flex-shrink-0">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-1 mb-1.5">
                <div class="flex items-center space-x-2 text-xs font-semibold tracking-wider text-stone-400 uppercase">
                    <span class="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
                    <span>大字跑馬燈 (3 組記憶槽位)</span>
                </div>
                
                <!-- Slots Selector -->
                <div class="flex items-center space-x-1">
                    <span class="text-xs text-stone-400">槽位：</span>
                    <div id="marqueeSlots" class="flex space-x-1"></div>
                </div>
            </div>
            
            <!-- Ticker Track -->
            <div class="overflow-hidden py-1 w-full relative bg-stone-950 rounded-xl border border-stone-800/80">
                <div id="marqueeTrack" class="animate-marquee space-x-12 text-2xl sm:text-3xl font-black tracking-wide text-white drop-shadow-md">
                    <!-- Dynamic Marquee Ticker -->
                </div>
            </div>

            <!-- Controls & School Icons Quick Insert -->
            <div class="mt-2 pt-1.5 border-t border-stone-800 flex flex-col gap-1.5 text-xs">
                <!-- School Icon Quick Insert Bar -->
                <div class="flex flex-wrap items-center gap-1 bg-stone-800/50 px-2 py-1 rounded-lg border border-stone-800">
                    <span class="text-stone-400 mr-1">插入學校圖示：</span>
                    <button type="button" onclick="insertIcon('📚')" class="px-2 py-0.5 bg-stone-700 hover:bg-amber-600 hover:text-stone-950 text-white rounded transition-all">📚 課本</button>
                    <button type="button" onclick="insertIcon('📖')" class="px-2 py-0.5 bg-stone-700 hover:bg-amber-600 hover:text-stone-950 text-white rounded transition-all">📖 閱讀</button>
                    <button type="button" onclick="insertIcon('🧹')" class="px-2 py-0.5 bg-stone-700 hover:bg-amber-600 hover:text-stone-950 text-white rounded transition-all">🧹 打掃</button>
                    <button type="button" onclick="insertIcon('✏️')" class="px-2 py-0.5 bg-stone-700 hover:bg-amber-600 hover:text-stone-950 text-white rounded transition-all">✏️ 寫字</button>
                    <button type="button" onclick="insertIcon('🎒')" class="px-2 py-0.5 bg-stone-700 hover:bg-amber-600 hover:text-stone-950 text-white rounded transition-all">🎒 書包</button>
                    <button type="button" onclick="insertIcon('🏫')" class="px-2 py-0.5 bg-stone-700 hover:bg-amber-600 hover:text-stone-950 text-white rounded transition-all">🏫 學校</button>
                    <button type="button" onclick="insertIcon('🎨')" class="px-2 py-0.5 bg-stone-700 hover:bg-amber-600 hover:text-stone-950 text-white rounded transition-all">🎨 美勞</button>
                    <button type="button" onclick="insertIcon('⚽')" class="px-2 py-0.5 bg-stone-700 hover:bg-amber-600 hover:text-stone-950 text-white rounded transition-all">⚽ 體育</button>
                </div>

                <div class="flex items-center space-x-2 w-full">
                    <input type="text" id="marqueeInput" placeholder="輸入跑馬燈文字..." class="bg-stone-800 text-white px-3 py-1 rounded-lg text-xs flex-grow focus:outline-none focus:ring-2 focus:ring-amber-500 border border-stone-700">
                    <button id="saveMarqueeSlotBtn" class="bg-amber-500 hover:bg-amber-600 text-stone-950 px-3 py-1 rounded-lg font-bold transition-all shadow-md whitespace-nowrap">儲存至當前槽位</button>
                </div>
            </div>
        </div>

        <!-- BOTTOM: TIMER & SANDGLASS DASHBOARD -->
        <div class="w-full bg-white/90 dark:bg-stone-800/90 backdrop-blur-xl border border-stone-200 dark:border-stone-700 rounded-2xl p-3 sm:p-4 shadow-xl flex flex-col md:flex-row items-center justify-around gap-4 flex-shrink-0">
            
            <!-- Left Side: Sandglass SVG Visualizer -->
            <div class="flex flex-col items-center">
                <div class="text-center mb-1">
                    <span id="statusBadge" class="inline-block px-3 py-0.5 rounded-full text-xs font-semibold uppercase tracking-wider bg-amber-100 dark:bg-amber-900/50 text-amber-700 dark:text-amber-300">準備就緒</span>
                </div>

                <!-- HOURGLASS SVG CONTAINER -->
                <div id="hourglassContainer" class="relative cursor-pointer group transition-transform duration-300 hover:scale-105" title="點擊切換 啟動/暫停">
                    <svg id="hourglassSvg" class="w-36 h-36 sm:w-44 sm:h-44 transition-all duration-500 drop-shadow-xl" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- Top & Bottom wooden caps -->
                        <rect x="45" y="8" width="110" height="14" rx="5" class="fill-stone-700 dark:fill-stone-600 shadow-lg"/>
                        <rect x="45" y="178" width="110" height="14" rx="5" class="fill-stone-700 dark:fill-stone-600 shadow-lg"/>
                        <path d="M55 22V10M145 22V10M55 178V190M145 178V190" stroke="currentColor" stroke-width="6" stroke-linecap="round" class="text-stone-500 dark:text-stone-400"/>
                        
                        <!-- Glass bulbs -->
                        <path d="M60 22C60 22 72 85 100 100C128 85 140 22 140 22H60Z" class="fill-sky-100/30 dark:fill-sky-900/20 stroke-stone-300 dark:stroke-stone-500" stroke-width="4" stroke-linejoin="round"/>
                        <path d="M60 178C60 178 72 115 100 100C128 115 140 178 140 178H60Z" class="fill-sky-100/30 dark:fill-sky-900/20 stroke-stone-300 dark:stroke-stone-500" stroke-width="4" stroke-linejoin="round"/>

                        <!-- Top sand: Decreasing from top downwards -->
                        <path id="topSand" d="M65 28H135L100 100Z" class="fill-amber-500 dark:fill-amber-400 transition-all duration-100"/>
                        <!-- Bottom sand: Right-side-up triangle growing from bottom -->
                        <path id="bottomSand" d="M100 172C100 172 100 172 100 172Z" class="fill-amber-500 dark:fill-amber-400 transition-all duration-100"/>

                        <!-- Falling Sand Stream & Particles -->
                        <g id="sandParticlesGroup"></g>
                        <line id="sandStream" x1="100" y1="100" x2="100" y2="160" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" class="opacity-0 transition-opacity duration-300"/>

                        <!-- Highlights -->
                        <path d="M68 35C68 35 74 75 88 92" stroke="white" stroke-width="3" stroke-linecap="round" class="opacity-40"/>
                        <path d="M68 165C68 165 74 125 88 108" stroke="white" stroke-width="3" stroke-linecap="round" class="opacity-40"/>
                    </svg>

                    <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 bg-black/30 backdrop-blur-[2px] rounded-full transition-opacity duration-300 pointer-events-none">
                        <span id="overlayActionText" class="text-white font-bold text-xs drop-shadow-md">點擊開始</span>
                    </div>
                </div>
            </div>

            <!-- Right Side: Controls, Time Display & Memory Presets -->
            <div class="flex flex-col items-center md:items-start flex-grow max-w-sm w-full">
                <!-- TIME DISPLAY -->
                <div class="w-full mb-2 bg-stone-900/90 dark:bg-stone-950 backdrop-blur-md px-4 py-1.5 rounded-xl border border-amber-500/30 shadow-xl text-center">
                    <div id="timeDisplay" class="text-3xl sm:text-4xl font-black tracking-widest font-mono text-amber-300 drop-shadow-md">05:00</div>
                </div>

                <!-- PROGRESS BAR -->
                <div class="w-full bg-stone-100 dark:bg-stone-700 rounded-full h-2 mb-3 overflow-hidden shadow-inner">
                    <div id="progressBar" class="bg-gradient-to-r from-amber-500 to-orange-500 h-full w-full transition-all duration-300 rounded-full"></div>
                </div>

                <!-- START/PAUSE & RESET BUTTONS -->
                <div class="flex gap-2 w-full mb-3">
                    <button id="startPauseBtn" class="flex-1 py-2.5 px-3 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white font-bold rounded-xl shadow-md active:scale-95 transition-all flex items-center justify-center space-x-1.5 text-xs">
                        <svg id="startPauseIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span id="startPauseText">開始計時</span>
                    </button>
                    <button id="resetBtn" class="py-2.5 px-3 bg-stone-100 hover:bg-stone-200 dark:bg-stone-700 dark:hover:bg-stone-600 text-stone-700 dark:text-stone-200 font-bold rounded-xl shadow-sm active:scale-95 transition-all flex items-center justify-center space-x-1 text-xs">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        <span>重設</span>
                    </button>
                </div>

                <!-- CUSTOM TIME & MEMORY PRESETS -->
                <div class="w-full border-t border-stone-200 dark:border-stone-700 pt-2">
                    <div class="flex justify-between items-center mb-1.5 text-xs">
                        <span class="font-bold text-stone-700 dark:text-stone-300">⏱️ 設定與記憶時間 (支援秒數)</span>
                        <div class="flex items-center space-x-1">
                            <div class="flex items-center bg-stone-100 dark:bg-stone-700 rounded-lg px-1.5 py-0.5 border border-stone-200 dark:border-stone-600">
                                <input type="number" id="customMinutes" min="0" max="180" value="5" class="w-7 bg-transparent text-center font-bold text-xs focus:outline-none">
                                <span class="text-[10px] text-stone-500 mr-0.5">分</span>
                                <input type="number" id="customSeconds" min="0" max="59" value="0" class="w-7 bg-transparent text-center font-bold text-xs focus:outline-none">
                                <span class="text-[10px] text-stone-500">秒</span>
                            </div>
                            <button id="savePresetBtn" class="bg-stone-900 hover:bg-stone-800 dark:bg-stone-100 dark:text-stone-900 text-white px-2 py-1 rounded-lg font-bold text-xs transition-all whitespace-nowrap">儲存</button>
                        </div>
                    </div>

                    <div id="presetsContainer" class="flex flex-wrap gap-1">
                        <!-- Dynamic Presets with delete button -->
                    </div>
                </div>

            </div>
        </div>

    </main>

    <script>
        // App State Variables
        let totalSeconds = 300; 
        let remainingSeconds = 300;
        let timerInterval = null;
        let isRunning = false;

        let defaultPresets = [
            { label: '30 秒', seconds: 30 },
            { label: '1 分鐘', seconds: 60 },
            { label: '3 分鐘', seconds: 180 },
            { label: '5 分鐘', seconds: 300 },
            { label: '10 分鐘', seconds: 600 },
            { label: '25 分鐘', seconds: 1500 }
        ];
        
        let userPresets = JSON.parse(localStorage.getItem('sandglass_user_presets') || '[]');
        
        let marqueeSlots = JSON.parse(localStorage.getItem('sandglass_marquee_slots') || JSON.stringify([
            "📚 上課了！拿出課本！ ✨",
            "🧹 打掃時間！",
            "📖 晨讀中！請安靜看書！ 🤫"
        ]));
        let activeMarqueeSlot = 0;

        let particles = [];
        const maxParticles = 25;

        // DOM Elements
        const timeDisplay = document.getElementById('timeDisplay');
        const progressBar = document.getElementById('progressBar');
        const startPauseBtn = document.getElementById('startPauseBtn');
        const startPauseIcon = document.getElementById('startPauseIcon');
        const startPauseText = document.getElementById('startPauseText');
        const resetBtn = document.getElementById('resetBtn');
        const hourglassContainer = document.getElementById('hourglassContainer');
        const overlayActionText = document.getElementById('overlayActionText');
        const statusBadge = document.getElementById('statusBadge');
        const customMinutes = document.getElementById('customMinutes');
        const customSeconds = document.getElementById('customSeconds');
        const savePresetBtn = document.getElementById('savePresetBtn');
        const presetsContainer = document.getElementById('presetsContainer');
        const toast = document.getElementById('toast');
        const topSand = document.getElementById('topSand');
        const bottomSand = document.getElementById('bottomSand');
        const sandStream = document.getElementById('sandStream');
        const sandParticlesGroup = document.getElementById('sandParticlesGroup');
        const hourglassSvg = document.getElementById('hourglassSvg');
        const marqueeTrack = document.getElementById('marqueeTrack');
        const marqueeInput = document.getElementById('marqueeInput');
        const saveMarqueeSlotBtn = document.getElementById('saveMarqueeSlotBtn');
        const marqueeSlotsContainer = document.getElementById('marqueeSlots');

        function showToast(message) {
            toast.textContent = message;
            toast.classList.remove('hidden', 'translate-y-1', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-1', 'opacity-0');
                setTimeout(() => toast.classList.add('hidden'), 200);
            }, 2000);
        }

        window.insertIcon = function(icon) {
            marqueeInput.value += icon;
            marqueeInput.focus();
        }

        function renderMarquee() {
            const currentText = marqueeSlots[activeMarqueeSlot] || "";
            const chunkHtml = `<span class="mx-6">${currentText}</span>`;
            marqueeTrack.innerHTML = chunkHtml.repeat(6);
        }

        function renderMarqueeSlots() {
            marqueeSlotsContainer.innerHTML = '';
            marqueeSlots.forEach((slotText, index) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `px-2.5 py-0.5 rounded text-xs font-bold transition-all border ${
                    activeMarqueeSlot === index 
                        ? 'bg-amber-500 text-stone-950 border-amber-400 shadow' 
                        : 'bg-stone-800 text-stone-300 border-stone-700 hover:bg-stone-700'
                }`;
                btn.textContent = `槽位 ${index + 1}`;
                btn.title = slotText;
                btn.addEventListener('click', () => {
                    activeMarqueeSlot = index;
                    marqueeInput.value = marqueeSlots[index] || "";
                    renderMarquee();
                    renderMarqueeSlots();
                    showToast(`已切換至跑馬燈槽位 ${index + 1}`);
                });
                marqueeSlotsContainer.appendChild(btn);
            });
            marqueeInput.value = marqueeSlots[activeMarqueeSlot] || "";
        }

        function renderPresets() {
            presetsContainer.innerHTML = '';
            
            // Render default presets
            defaultPresets.forEach(preset => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'px-2.5 py-1 bg-stone-100 hover:bg-amber-100 dark:bg-stone-700 dark:hover:bg-amber-900/40 text-stone-700 dark:text-stone-200 rounded-lg text-xs font-bold transition-all shadow-sm border border-stone-200 dark:border-stone-600';
                btn.textContent = preset.label;
                btn.addEventListener('click', () => {
                    setTimerSeconds(preset.seconds);
                    showToast(`已切換至 ${preset.label}`);
                });
                presetsContainer.appendChild(btn);
            });

            // Render user saved presets
            userPresets.forEach((preset, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'inline-flex items-center bg-amber-50 dark:bg-amber-950/40 border border-amber-300 dark:border-amber-700 rounded-lg overflow-hidden shadow-sm';
                
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'px-2 py-1 text-amber-800 dark:text-amber-200 text-xs font-bold hover:bg-amber-100 dark:hover:bg-amber-900/50 transition-all';
                btn.textContent = preset.label;
                btn.addEventListener('click', () => {
                    setTimerSeconds(preset.seconds);
                    showToast(`已切換至 ${preset.label}`);
                });
                
                const delBtn = document.createElement('button');
                delBtn.type = 'button';
                delBtn.className = 'px-1.5 py-1 text-amber-700 dark:text-amber-300 hover:bg-red-500 hover:text-white text-[10px] transition-all border-l border-amber-300 dark:border-amber-700';
                delBtn.textContent = '✕';
                delBtn.title = '刪除此記憶時間';
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    userPresets.splice(index, 1);
                    localStorage.setItem('sandglass_user_presets', JSON.stringify(userPresets));
                    renderPresets();
                    showToast('已刪除記憶時間');
                });

                wrapper.appendChild(btn);
                wrapper.appendChild(delBtn);
                presetsContainer.appendChild(wrapper);
            });
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function updateDisplay() {
            timeDisplay.textContent = formatTime(remainingSeconds);
            const progress = totalSeconds > 0 ? (remainingSeconds / totalSeconds) : 0;
            progressBar.style.width = `${progress * 100}%`;

            // Update hourglass SVG sand levels
            // Top bulb sand: drains from top downwards
            // Top bulb bounding box in SVG: y=22 to y=100 (height 78)
            const topSandHeight = 78 * progress;
            const topY = 100 - topSandHeight;
            // Width at top y: lerp between 10 (at y=100) and 70 (at y=22)
            const topHalfWidth = 10 + (70 - 10) * ((topY - 22) / 78);
            const leftX = 100 - topHalfWidth;
            const rightX = 100 + topHalfWidth;
            topSand.setAttribute('d', `M${leftX} ${topY} H${rightX} L100 100 Z`);

            // Bottom bulb sand: right-side-up triangle growing from bottom y=172 upwards to y=100
            const bottomSandHeight = 72 * (1 - progress);
            const bottomY = 172 - bottomSandHeight;
            const bottomHalfWidth = 40 * (bottomSandHeight / 72);
            const bLeftX = 100 - bottomHalfWidth;
            const bRightX = 100 + bottomHalfWidth;
            bottomSand.setAttribute('d', `M100 172 L${bLeftX} ${bottomY} L${bRightX} ${bottomY} Z`);
        }

        function setTimerSeconds(sec) {
            pauseTimer();
            totalSeconds = sec;
            remainingSeconds = sec;
            updateDisplay();
        }

        function updateParticles() {
            if (!isRunning) {
                sandParticlesGroup.innerHTML = '';
                return;
            }
            
            // Add new particle
            if (particles.length < maxParticles && Math.random() < 0.6) {
                particles.push({
                    y: 100,
                    vy: 2 + Math.random() * 2,
                    opacity: 0.8
                });
            }

            let html = '';
            particles.forEach(p => {
                p.y += p.vy;
                p.opacity -= 0.02;
                if (p.y < 165 && p.opacity > 0) {
                    html += `<circle cx="100" cy="${p.y}" r="1.5" fill="#f59e0b" opacity="${p.opacity}"/>`;
                }
            });
            particles = particles.filter(p => p.y < 165 && p.opacity > 0);
            sandParticlesGroup.innerHTML = html;
        }

        let animFrameId = null;
        function animationLoop() {
            if (isRunning) {
                updateParticles();
                animFrameId = requestAnimationFrame(animationLoop);
            }
        }

        function startTimer() {
            if (remainingSeconds <= 0) {
                remainingSeconds = totalSeconds;
            }
            isRunning = true;
            startPauseText.textContent = '暫停計時';
            startPauseIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>';
            statusBadge.textContent = '計時中...';
            statusBadge.className = 'inline-block px-3 py-0.5 rounded-full text-xs font-semibold uppercase tracking-wider bg-emerald-100 dark:bg-emerald-900/50 text-emerald-700 dark:text-emerald-300';
            overlayActionText.textContent = '點擊暫停';
            hourglassSvg.classList.add('hourglass-active');
            sandStream.style.opacity = '1';

            if (animFrameId) cancelAnimationFrame(animFrameId);
            animFrameId = requestAnimationFrame(animationLoop);

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (remainingSeconds > 0) {
                    remainingSeconds--;
                    updateDisplay();
                    if (remainingSeconds <= 0) {
                        finishTimer();
                    }
                }
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            if (timerInterval) clearInterval(timerInterval);
            if (animFrameId) cancelAnimationFrame(animFrameId);
            startPauseText.textContent = '開始計時';
            startPauseIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>';
            statusBadge.textContent = '已暫停';
            statusBadge.className = 'inline-block px-3 py-0.5 rounded-full text-xs font-semibold uppercase tracking-wider bg-amber-100 dark:bg-amber-900/50 text-amber-700 dark:text-amber-300';
            overlayActionText.textContent = '點擊開始';
            hourglassSvg.classList.remove('hourglass-active');
            sandStream.style.opacity = '0';
            sandParticlesGroup.innerHTML = '';
        }

        function finishTimer() {
            pauseTimer();
            statusBadge.textContent = '時間到！';
            statusBadge.className = 'inline-block px-3 py-0.5 rounded-full text-xs font-semibold uppercase tracking-wider bg-red-100 dark:bg-red-900/50 text-red-700 dark:text-red-300';
            playChimeSustained();
            showToast('⏰ 時間到！');
        }

        // 4-Second Sustained Completion Chime using Web Audio API
        function playChimeSustained() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.15);
                    
                    gain.gain.setValueAtTime(0, ctx.currentTime + idx * 0.15);
                    gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + idx * 0.15 + 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 4.0);
                    
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    
                    osc.start(ctx.currentTime + idx * 0.15);
                    osc.stop(ctx.currentTime + 4.0);
                });
            } catch (e) {
                console.warn('Audio note playback note:', e);
            }
        }

        // Event Listeners
        startPauseBtn.addEventListener('click', () => {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        });

        resetBtn.addEventListener('click', () => {
            pauseTimer();
            remainingSeconds = totalSeconds;
            updateDisplay();
            showToast('計時器已重設');
        });

        hourglassContainer.addEventListener('click', () => {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        });

        savePresetBtn.addEventListener('click', () => {
            const m = parseInt(customMinutes.value) || 0;
            const s = parseInt(customSeconds.value) || 0;
            const total = (m * 60) + s;
            if (total <= 0) {
                showToast('請輸入大於 0 的時間');
                return;
            }
            const label = m > 0 && s > 0 ? `${m}分${s}秒` : (m > 0 ? `${m} 分鐘` : `${s} 秒`);
            
            // Check if preset already exists
            const exists = userPresets.some(p => p.seconds === total);
            if (!exists) {
                userPresets.push({ label, seconds: total });
                localStorage.setItem('sandglass_user_presets', JSON.stringify(userPresets));
                renderPresets();
                showToast(`已儲存記憶時間：${label}`);
            } else {
                showToast('此時間已存在記憶中');
            }
            setTimerSeconds(total);
        });

        saveMarqueeSlotBtn.addEventListener('click', () => {
            const val = marqueeInput.value.trim();
            if (!val) {
                showToast('請輸入跑馬燈文字');
                return;
            }
            marqueeSlots[activeMarqueeSlot] = val;
            localStorage.setItem('sandglass_marquee_slots', JSON.stringify(marqueeSlots));
            renderMarquee();
            renderMarqueeSlots();
            showToast(`已成功儲存至槽位 ${activeMarqueeSlot + 1}`);
        });

        // Initial setup on load
        renderMarquee();
        renderMarqueeSlots();
        renderPresets();
        updateDisplay();
    </script>
</body>
</html>
